import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

// Secrets live in local.properties (gitignored), never in source. Each is
// required to actually build this app — but the check must not run during
// Gradle's configuration phase, since that runs for every module in the
// multi-project build (e.g. when JitPack only wants to build :mylibrary and
// has no local.properties at all). Instead we resolve to a placeholder here
// and only fail loudly from checkRequiredSecrets, which real app build tasks
// depend on.
def localPropsFile = file("$rootDir/local.properties")
def localProps = new Properties()
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def getLocalProp = { String key -> localProps.getProperty(key, "REPLACE_ME") }

tasks.register("checkRequiredSecrets") {
    doLast {
        ["FIREBASE_WEB_API_KEY", "ITS_CLIENT_ID", "ITS_API_KEY"].each { key ->
            def value = localProps.getProperty(key)
            if (value == null || value.isEmpty() || value == "REPLACE_ME") {
                throw new GradleException("Missing or placeholder '$key' in local.properties. See local.properties.example.")
            }
        }
    }
}
tasks.matching { it.name.startsWith("assemble") || it.name.startsWith("compile") || it.name.startsWith("bundle") || it.name.startsWith("install") }
        .configureEach { dependsOn "checkRequiredSecrets" }

android {
    namespace 'com.fe.sdkparentapp'
    compileSdk 35


    defaultConfig {
        applicationId "com.fe.sdkparentapp"
        minSdk 24
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "FIREBASE_WEB_API_KEY", "\"${getLocalProp('FIREBASE_WEB_API_KEY')}\""
        buildConfigField "String", "ITS_CLIENT_ID", "\"${getLocalProp('ITS_CLIENT_ID')}\""
        buildConfigField "String", "ITS_API_KEY", "\"${getLocalProp('ITS_API_KEY')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    implementation 'com.github.Intellexal-Solutions-ITS:its-notification-library:1.0.10'

}

