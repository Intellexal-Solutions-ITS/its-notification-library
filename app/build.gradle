import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
}

// Secrets live in local.properties (gitignored), never in source. Each is
// required — the build fails loudly instead of silently shipping an empty key.
def localProps = new Properties()
file("$rootDir/local.properties").withInputStream { localProps.load(it) }
def requireLocalProp = { String key ->
    def value = localProps.getProperty(key)
    if (value == null || value.isEmpty() || value == "REPLACE_ME") {
        throw new GradleException("Missing or placeholder '$key' in local.properties. See local.properties.example.")
    }
    return value
}

android {
    namespace 'com.fe.sdkparentapp'
    compileSdk 35


    defaultConfig {
        applicationId "com.fe.sdkparentapp"
        minSdk 24
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "FIREBASE_WEB_API_KEY", "\"${requireLocalProp('FIREBASE_WEB_API_KEY')}\""
        buildConfigField "String", "ITS_CLIENT_ID", "\"${requireLocalProp('ITS_CLIENT_ID')}\""
        buildConfigField "String", "ITS_API_KEY", "\"${requireLocalProp('ITS_API_KEY')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging

    implementation 'com.github.Intellexal-Solutions-ITS:its-notification-library:1.0.10'

}

